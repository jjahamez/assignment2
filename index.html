<body>
  <h1> Cubic Equation Calculator </h1>

  <p> Solve the roots of any Cubic Equation by entering the 4 values! (ax³ + bx² + cx + d)</p>

  <div class="form-container">
    <form id="cubic-form">
      <div class="abcd-inputs">
        <label for="a"> Enter A value </label>
        <input type="text" id="a" name="a">
        <label for="b"> Enter B value </label>
        <input type="text" id="b" name="b">
        <label for="c"> Enter C value </label>
        <input type="text" id="c" name="c">
        <label for="d"> Enter D value </label>
        <input type="text" id="d" name="d">
        <input type="submit" value="Calculate">
      </div>
      <p id="message"> </p>
    </form>
  </div>

  <div class="results-graph-container">
    <div class="Results">
      <label for="p-value"> P Value </label>
      <input type="text" id="p-value" readonly />
      <label for="q-value"> Q Value </label>
      <input type="text" id="q-value" readonly />
      <label for="discriminant"> Discriminant </label>
      <input type="text" id="discriminant" readonly />
      <label for="root-1"> Root 1 </label>
      <input type="text" id="root-1" readonly />
      <label for="root-2"> Root 2 </label>
      <input type="text" id="root-2" readonly />
      <label for="root-3"> Root 3 </label>
      <input type="text" id="root-3" readonly />
    </div>

    <div class="graph-container">
      <p id="equation"> </p>
      <canvas id="graph" width="500" height="500"></canvas>

    </div>
  </div>

  <script src="src/main.ts"> </script>
